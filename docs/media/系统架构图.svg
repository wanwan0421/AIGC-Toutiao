<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1180" viewBox="0 0 1920 1180" role="img" aria-labelledby="title desc">
  <title id="title">AI 创作者辅助生产与分发平台系统架构图</title>
  <desc id="desc">展示浏览器、Nginx、Next.js、NestJS API、独立 AI Worker、PostgreSQL、Redis、上传存储以及火山方舟模型服务之间的调用、事务 Outbox、BullMQ、Responses 会话和持久化关系。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef4fb"/>
    </linearGradient>
    <linearGradient id="blueHeader" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1769e0"/>
      <stop offset="1" stop-color="#3190f5"/>
    </linearGradient>
    <linearGradient id="violetHeader" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6454d6"/>
      <stop offset="1" stop-color="#8b6ff0"/>
    </linearGradient>
    <linearGradient id="greenHeader" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#07856d"/>
      <stop offset="1" stop-color="#16a88d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#15355f" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2377e5"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b927c"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e98219"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#735bd7"/>
    </marker>
    <style>
      .title { font: 700 46px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #0d2c55; }
      .subtitle { font: 400 20px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #57708e; }
      .zone-title { font: 700 22px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #ffffff; }
      .card-title { font: 700 25px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #102c4d; }
      .card-subtitle { font: 500 17px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #5b7089; }
      .line { font: 400 16px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #435d78; }
      .small { font: 400 14px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #607791; }
      .flow { font: 600 15px "Microsoft YaHei", "PingFang SC", sans-serif; }
      .legend { font: 500 15px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #415b76; }
      .card { fill: #ffffff; stroke: #c5d5e8; stroke-width: 1.5; }
      .inner { fill: #f5f8fc; stroke: #d9e3ef; stroke-width: 1; }
      .blue-flow { fill: none; stroke: #2377e5; stroke-width: 3; marker-end: url(#arrowBlue); }
      .green-flow { fill: none; stroke: #0b927c; stroke-width: 3; marker-end: url(#arrowGreen); }
      .orange-flow { fill: none; stroke: #e98219; stroke-width: 3; marker-end: url(#arrowOrange); }
      .purple-flow { fill: none; stroke: #735bd7; stroke-width: 3; marker-end: url(#arrowPurple); }
      .contract-flow { fill: none; stroke: #8a9bb0; stroke-width: 2; stroke-dasharray: 7 7; }
    </style>
  </defs>

  <rect width="1920" height="1180" fill="url(#background)"/>
  <circle cx="1760" cy="90" r="190" fill="#dcecff" opacity="0.48"/>
  <circle cx="150" cy="1090" r="230" fill="#e2f3ee" opacity="0.55"/>

  <text x="70" y="72" class="title">AI 创作者辅助生产与分发平台 · 系统架构</text>
  <text x="72" y="108" class="subtitle">事务 Outbox + BullMQ 可靠任务链路 · Responses 会话管理 · PostgreSQL 永久归档 · Redis 缓存与分布式协调</text>

  <!-- 用户与入口 -->
  <g filter="url(#shadow)">
    <rect x="48" y="330" width="220" height="170" rx="20" class="card" stroke="#77a8e8"/>
    <circle cx="158" cy="382" r="28" fill="#e9f2ff"/>
    <circle cx="158" cy="373" r="10" fill="#2377e5"/>
    <path d="M137 406c3-15 12-22 21-22s18 7 21 22" fill="#2377e5"/>
    <text x="158" y="444" text-anchor="middle" class="card-title">创作者 / 读者</text>
    <text x="158" y="474" text-anchor="middle" class="card-subtitle">浏览器 · 多标签页</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="330" y="318" width="240" height="194" rx="20" class="card" stroke="#69b69f"/>
    <rect x="330" y="318" width="240" height="48" rx="20" fill="url(#greenHeader)"/>
    <path d="M330 346h240v20H330z" fill="url(#greenHeader)"/>
    <text x="450" y="350" text-anchor="middle" class="zone-title">统一公网入口</text>
    <text x="450" y="410" text-anchor="middle" class="card-title">Nginx</text>
    <text x="450" y="443" text-anchor="middle" class="line">/ → Next.js Web</text>
    <text x="450" y="473" text-anchor="middle" class="line">/api/* → NestJS API</text>
  </g>

  <!-- 应用层 -->
  <rect x="630" y="145" width="780" height="592" rx="26" fill="#f8fbff" stroke="#6ea2ea" stroke-width="2" stroke-dasharray="10 8"/>
  <rect x="670" y="126" width="170" height="42" rx="14" fill="url(#blueHeader)"/>
  <text x="755" y="155" text-anchor="middle" class="zone-title">应用与任务执行层</text>

  <g filter="url(#shadow)">
    <rect x="680" y="192" width="310" height="164" rx="18" class="card" stroke="#71a4e6"/>
    <circle cx="730" cy="242" r="25" fill="#101010"/>
    <text x="730" y="250" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#ffffff">N</text>
    <text x="770" y="238" class="card-title">Next.js Web</text>
    <text x="770" y="267" class="card-subtitle">编辑器与业务页面</text>
    <text x="710" y="311" class="line">AI Job 提交 / SSE 订阅 / 结果确认</text>
    <text x="710" y="338" class="small">contentId 任务隔离 · 刷新恢复 · 自动保存</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1040" y="192" width="320" height="164" rx="18" class="card" stroke="#9a8add"/>
    <rect x="1066" y="216" width="44" height="44" rx="10" fill="#eeeafe"/>
    <path d="M1077 231l11-7 11 7-11 7zM1077 234v13l10 6v-13zM1099 234v13l-10 6v-13z" fill="#735bd7"/>
    <text x="1126" y="238" class="card-title">共享契约</text>
    <text x="1126" y="267" class="card-subtitle">packages/shared</text>
    <text x="1070" y="311" class="line">DTO · AiJobType · SSE Event</text>
    <text x="1070" y="338" class="small">前后端统一任务状态与结果结构</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="680" y="410" width="330" height="286" rx="18" class="card" stroke="#71a4e6"/>
    <rect x="680" y="410" width="330" height="52" rx="18" fill="#eaf3ff"/>
    <path d="M680 444h330v18H680z" fill="#eaf3ff"/>
    <circle cx="720" cy="436" r="17" fill="#2377e5"/>
    <path d="M712 436h16M720 428v16" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <text x="750" y="444" class="card-title">NestJS API</text>
    <rect x="704" y="480" width="282" height="45" rx="10" class="inner"/>
    <text x="720" y="508" class="line">REST / SSE · 鉴权 · 内容生命周期</text>
    <rect x="704" y="535" width="282" height="56" rx="10" fill="#fff7ed" stroke="#f2c58c"/>
    <text x="720" y="558" class="line">AI Job + 事务 Outbox</text>
    <text x="720" y="580" class="small">幂等键 · 用户并发控制 · 可靠派发</text>
    <rect x="704" y="601" width="282" height="72" rx="10" class="inner"/>
    <text x="720" y="625" class="line">会话归档 / Prompt / 工作流门禁</text>
    <text x="720" y="648" class="small">cache-aside · 内容哈希 · 结果提交</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1050" y="410" width="310" height="286" rx="18" class="card" stroke="#9a8add"/>
    <rect x="1050" y="410" width="310" height="52" rx="18" fill="#f0edff"/>
    <path d="M1050 444h310v18h-310z" fill="#f0edff"/>
    <circle cx="1090" cy="436" r="17" fill="#735bd7"/>
    <path d="M1081 436h18M1090 427v18" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <text x="1120" y="444" class="card-title">独立 AI Worker</text>
    <rect x="1074" y="480" width="262" height="45" rx="10" class="inner"/>
    <text x="1090" y="508" class="line">BullMQ 消费 · 重试 · 取消</text>
    <rect x="1074" y="535" width="262" height="56" rx="10" fill="#f6f3ff" stroke="#c9bff1"/>
    <text x="1090" y="558" class="line">Agent / Pipeline 编排</text>
    <text x="1090" y="580" class="small">阶段检查点 · 结构化输出修复</text>
    <rect x="1074" y="601" width="262" height="72" rx="10" class="inner"/>
    <text x="1090" y="625" class="line">安全审核 · 图片 · 会话压缩</text>
    <text x="1090" y="648" class="small">Responses 游标 · 分布式会话锁</text>
  </g>

  <!-- 外部服务 -->
  <rect x="1490" y="145" width="374" height="592" rx="26" fill="#fbfaff" stroke="#8e7adc" stroke-width="2" stroke-dasharray="10 8"/>
  <rect x="1528" y="126" width="180" height="42" rx="14" fill="url(#violetHeader)"/>
  <text x="1618" y="155" text-anchor="middle" class="zone-title">外部模型与服务</text>

  <g filter="url(#shadow)">
    <rect x="1530" y="192" width="294" height="288" rx="18" class="card" stroke="#9684df"/>
    <circle cx="1574" cy="233" r="21" fill="#eeeafe"/>
    <path d="M1560 245c17-3 25-13 28-29 6 11 5 21-2 31-8 11-19 14-33 9 7-1 12-5 17-11-4 2-7 2-10 0z" fill="#735bd7"/>
    <text x="1607" y="239" class="card-title">火山方舟 Ark</text>
    <rect x="1553" y="270" width="248" height="49" rx="10" fill="#f6f3ff" stroke="#d4ccf4"/>
    <text x="1569" y="292" class="line">Responses API</text>
    <text x="1569" y="311" class="small">多轮会话 / 无状态生产阶段</text>
    <rect x="1553" y="329" width="248" height="49" rx="10" class="inner"/>
    <text x="1569" y="351" class="line">Chat Completions</text>
    <text x="1569" y="370" class="small">兼容无状态智能体</text>
    <rect x="1553" y="388" width="248" height="49" rx="10" class="inner"/>
    <text x="1569" y="410" class="line">Images API</text>
    <text x="1569" y="429" class="small">封面图与正文配图</text>
    <text x="1555" y="461" class="small">Structured Outputs · Usage · X-Fornax-Trace</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1530" y="510" width="294" height="86" rx="16" class="card" stroke="#6db8c4"/>
    <circle cx="1571" cy="553" r="19" fill="#e7f7f8"/>
    <path d="M1562 553h18M1571 544v18" stroke="#148a9a" stroke-width="3" stroke-linecap="round"/>
    <text x="1603" y="548" class="card-title">高德地图</text>
    <text x="1603" y="574" class="card-subtitle">位置与地图 Web 服务</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1530" y="616" width="294" height="86" rx="16" class="card" stroke="#6db8c4"/>
    <rect x="1552" y="637" width="38" height="30" rx="5" fill="none" stroke="#148a9a" stroke-width="3"/>
    <path d="M1554 640l17 14 17-14" fill="none" stroke="#148a9a" stroke-width="3"/>
    <text x="1603" y="652" class="card-title">通知服务</text>
    <text x="1603" y="678" class="card-subtitle">SMTP Email / 阿里云 SMS</text>
  </g>

  <!-- 数据与基础设施 -->
  <rect x="330" y="820" width="1210" height="270" rx="26" fill="#f7fcfa" stroke="#39a88f" stroke-width="2" stroke-dasharray="10 8"/>
  <rect x="370" y="800" width="190" height="42" rx="14" fill="url(#greenHeader)"/>
  <text x="465" y="829" text-anchor="middle" class="zone-title">数据与基础设施</text>

  <g filter="url(#shadow)">
    <rect x="375" y="865" width="350" height="178" rx="18" class="card" stroke="#56aa98"/>
    <ellipse cx="420" cy="906" rx="22" ry="9" fill="#e4f5f0" stroke="#0b927c" stroke-width="3"/>
    <path d="M398 906v31c0 5 10 9 22 9s22-4 22-9v-31M398 922c0 5 10 9 22 9s22-4 22-9" fill="none" stroke="#0b927c" stroke-width="3"/>
    <text x="460" y="914" class="card-title">PostgreSQL</text>
    <text x="400" y="966" class="line">业务数据 · Prompt · 完整消息归档</text>
    <text x="400" y="993" class="line">Responses 游标 / 摘要 / 内容哈希</text>
    <text x="400" y="1020" class="small">AiJob · Outbox · Event · Checkpoint · AiCallLog</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="760" y="865" width="350" height="178" rx="18" class="card" stroke="#56aa98"/>
    <path d="M793 895h47l10 11-10 11h-47l-10-11zM793 920h47l10 11-10 11h-47l-10-11z" fill="#e4f5f0" stroke="#0b927c" stroke-width="2.5"/>
    <text x="865" y="914" class="card-title">Redis</text>
    <text x="786" y="966" class="line">BullMQ 队列 / 指数退避</text>
    <text x="786" y="993" class="line">近期消息 cache-aside / 会话锁</text>
    <text x="786" y="1020" class="small">Pub/Sub 取消与通知 · AOF 持久化</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1145" y="865" width="350" height="178" rx="18" class="card" stroke="#56aa98"/>
    <path d="M1175 904h20l8 9h34v35h-62z" fill="#e4f5f0" stroke="#0b927c" stroke-width="3" stroke-linejoin="round"/>
    <text x="1254" y="914" class="card-title">Uploads / 素材存储</text>
    <text x="1175" y="966" class="line">用户上传 · AI 封面 · 正文配图</text>
    <text x="1175" y="993" class="line">API 权限校验与静态资源分发</text>
    <text x="1175" y="1020" class="small">Docker volume，可替换为对象存储</text>
  </g>

  <!-- 主调用链路 -->
  <path d="M268 415H320" class="blue-flow"/>
  <text x="278" y="397" class="flow" fill="#2377e5">HTTPS</text>

  <path d="M570 365C615 365 612 274 670 274" class="blue-flow"/>
  <text x="588" y="302" class="flow" fill="#2377e5">页面 / 静态资源</text>
  <path d="M570 455C620 455 620 515 670 515" class="blue-flow"/>
  <text x="580" y="492" class="flow" fill="#2377e5">REST / SSE</text>

  <!-- 共享契约 -->
  <path d="M1040 274H1002" class="contract-flow"/>
  <path d="M1200 356V396" class="contract-flow"/>
  <path d="M1040 322C1015 348 980 372 930 400" class="contract-flow"/>

  <!-- Outbox / 队列 / Worker -->
  <path d="M786 696V780C786 804 706 816 630 850" class="orange-flow"/>
  <rect x="544" y="757" width="235" height="30" rx="10" fill="#fff6e9"/>
  <text x="557" y="778" class="flow" fill="#d66f0b">① 事务写入 AiJob + Outbox</text>

  <path d="M904 696V790C904 815 920 825 930 850" class="orange-flow"/>
  <rect x="904" y="759" width="205" height="30" rx="10" fill="#fff6e9"/>
  <text x="917" y="780" class="flow" fill="#d66f0b">② 派发至 BullMQ</text>

  <path d="M1070 850C1080 809 1168 786 1200 706" class="orange-flow"/>
  <rect x="1100" y="765" width="206" height="30" rx="10" fill="#fff6e9"/>
  <text x="1113" y="786" class="flow" fill="#d66f0b">③ Worker 消费 / 重试</text>

  <!-- 缓存与持久化 -->
  <path d="M846 696C844 760 835 790 826 850" class="green-flow"/>
  <text x="712" y="746" class="flow" fill="#0b927c">cache-aside / PubSub</text>
  <path d="M1120 696C1095 758 1020 792 1000 850" class="green-flow"/>
  <text x="1035" y="735" class="flow" fill="#0b927c">锁 / 进度</text>
  <path d="M1150 696C1100 750 720 785 660 850" class="green-flow"/>
  <text x="794" y="815" class="flow" fill="#0b927c">④ 结果 · 事件 · 日志 · 会话游标</text>
  <path d="M1250 696C1285 753 1310 797 1320 850" class="green-flow"/>
  <text x="1284" y="769" class="flow" fill="#0b927c">图片素材</text>

  <!-- 外部调用 -->
  <path d="M1360 505C1420 505 1450 330 1520 330" class="purple-flow"/>
  <rect x="1368" y="400" width="153" height="30" rx="10" fill="#f3f0ff"/>
  <text x="1380" y="421" class="flow" fill="#735bd7">⑤ 模型 / 图片调用</text>
  <text x="1677" y="724" text-anchor="middle" class="small">地图与通知服务由 NestJS API 按业务场景调用</text>

  <!-- 图例 -->
  <g transform="translate(440 1125)">
    <line x1="0" y1="0" x2="52" y2="0" stroke="#2377e5" stroke-width="4"/>
    <text x="64" y="6" class="legend">同步 HTTP / SSE</text>
    <line x1="235" y1="0" x2="287" y2="0" stroke="#e98219" stroke-width="4"/>
    <text x="299" y="6" class="legend">Outbox / BullMQ</text>
    <line x1="475" y1="0" x2="527" y2="0" stroke="#0b927c" stroke-width="4"/>
    <text x="539" y="6" class="legend">数据 / 缓存 / 状态</text>
    <line x1="740" y1="0" x2="792" y2="0" stroke="#735bd7" stroke-width="4"/>
    <text x="804" y="6" class="legend">模型服务调用</text>
  </g>
</svg>
