databases:
  - name: aicp-postgres
    databaseName: aicp
    user: aicp

services:
  - type: redis
    name: aicp-redis
    plan: starter
    ipAllowList: []

  - type: web
    name: aicp-api
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build -w @aicp/shared && npm run prisma -w @aicp/api -- generate && npm run build -w @aicp/api && npm run prisma -w @aicp/api -- migrate deploy
    startCommand: node apps/api/dist/scripts/seed-production-prompts.js && node apps/api/dist/main.js
    healthCheckPath: /api/health
    disk:
      name: aicp-uploads
      mountPath: /var/data/aicp/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: aicp-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: aicp-redis
          property: connectionString
      - key: WEB_ORIGIN
        value: https://app.example.com
      - key: UPLOAD_ROOT
        value: /var/data/aicp/uploads
      - key: UPLOAD_PUBLIC_BASE
        value: https://api.example.com/api/uploads
      - key: AUTH_TOKEN_SECRET
        sync: false
      - key: ARK_API_KEY
        sync: false
      - key: ARK_MODEL_ID
        sync: false
      - key: ARK_API_URL
        value: https://ark.cn-beijing.volces.com/api/v3/chat/completions
      - key: ARK_IMAGE_API_KEY
        sync: false
      - key: ARK_IMAGE_MODEL_ID
        sync: false
      - key: AMAP_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: ALIYUN_ACCESS_KEY_ID
        sync: false
      - key: ALIYUN_ACCESS_KEY_SECRET
        sync: false
      - key: ALIYUN_SMS_SIGN_NAME
        sync: false
      - key: ALIYUN_SMS_TEMPLATE_CODE
        sync: false
